name: Windows preview validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-offline-install:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Geometry and configuration
        run: .\Build.ps1 -Test
      - name: Deep build paths and failed-publication preservation
        run: .\tests\BuildPathTests.ps1
      - name: Offline source hosting and installer checks
        run: .\tests\LauncherTests.ps1
      - name: Package install update rollback uninstall
        run: .\tests\ReleaseTests.ps1
      - name: Build unsigned preview artifacts
        run: .\Build-Release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-preview
          path: |
            bin/releases/*.zip
            bin/releases/SHA256SUMS.txt
            bin/releases/release-info.json
          if-no-files-found: error
          retention-days: 14
